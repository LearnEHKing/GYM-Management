<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Login | Iron House</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            -webkit-tap-highlight-color: transparent;
        }


        :root {
            --bg: #050608;
            --card: #090b0e;

            --white: #f5f7fa;
            --muted: #737b87;

            --blue: #3b82f6;

            --border: #242931;
        }


        html,
        body {
            width: 100%;
            height: 100%;

            background: var(--bg);
        }


        body {

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            color: var(--white);

            overflow: hidden;
        }


        /* =====================================
           LOGIN CONTAINER
        ===================================== */

        .login-container {

            width: 100%;
            max-width: 360px;

            text-align: center;
        }


        /* =====================================
           BRAND
        ===================================== */

        .brand {

            margin-bottom: 38px;
        }


        .brand h1 {

            font-size: 27px;

            font-weight: 700;

            letter-spacing: .5px;
        }


        .brand span {

            color: var(--blue);

            text-shadow:
                0 0 15px
                rgba(59,130,246,.45);
        }


        /* =====================================
           FORM
        ===================================== */

        .login-form {

            display: flex;

            flex-direction: column;

            gap: 13px;
        }


        /* =====================================
           INPUT
        ===================================== */

        .input {

            width: 100%;

            height: 55px;

            padding:
                0 17px;

            border-radius: 15px;

            border: 1px solid var(--border);

            background:
                linear-gradient(
                    145deg,
                    #0b0d10,
                    #070809
                );

            color: var(--white);

            font-size: 14px;

            outline: none;

            transition:
                border-color .2s,
                box-shadow .2s;
        }


        .input::placeholder {

            color: #555d68;
        }


        .input:focus {

            border-color:
                rgba(59,130,246,.7);

            box-shadow:
                0 0 0 3px
                rgba(59,130,246,.08);
        }


        /* =====================================
           LOGIN BUTTON
        ===================================== */

        .login-button {

            width: 100%;

            height: 55px;

            margin-top: 5px;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #3b82f6,
                    #2563eb
                );

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 8px 25px
                rgba(37,99,235,.20);

            transition:
                transform .15s,
                box-shadow .15s;
        }


        .login-button:active {

            transform: scale(.97);

            box-shadow:
                0 4px 15px
                rgba(37,99,235,.15);
        }


        /* =====================================
           ERROR
        ===================================== */

        .error {

            min-height: 16px;

            color: #ef4444;

            font-size: 12px;

            margin-top: 2px;
        }


        /* =====================================
           DESKTOP
        ===================================== */

        @media (min-width: 600px) {

            .login-container {

                padding: 35px;

                border:
                    1px solid #171b20;

                border-radius: 25px;

                background:
                    rgba(8,10,13,.65);

                box-shadow:
                    0 30px 80px
                    rgba(0,0,0,.5);
            }

        }

    </style>

</head>


<body>


    <main class="login-container">


        <div class="brand">

            <h1>
                IRON <span>HOUSE</span>
            </h1>

        </div>


        <form
            class="login-form"
            onsubmit="login(event)"
        >


            <input
                id="username"
                class="input"
                type="text"
                placeholder="Username"
                autocomplete="username"
                required
            >


            <input
                id="password"
                class="input"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >


            <div
                id="error"
                class="error"
            ></div>


            <button
                class="login-button"
                type="submit"
            >
                Login
            </button>


        </form>


    </main>



    <script>

        function login(event) {

            event.preventDefault();


            const username =
                document.getElementById(
                    "username"
                ).value;


            const password =
                document.getElementById(
                    "password"
                ).value;


            /*
                Temporary login.

                Later Flask will handle this:

                fetch("/login", {
                    method: "POST",
                    body: ...
                })
            */


            if (
                username === "" ||
                password === ""
            ) {

                document.getElementById(
                    "error"
                ).textContent =
                    "Enter username and password.";

                return;
            }


            /*
                Temporary demo behaviour
            */

            console.log(
                "Login:",
                username
            );

        }

    </script>


</body>

</html>
