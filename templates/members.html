<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no" />
  <link rel="manifest" href="/static/manifest.json" />

  <meta name="theme-color" content="#050608" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Members</title>

  <style>
    /* =========================================
           RESET
        ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      /* DARK (default) */

      --bg: #050608;

      --white: #f5f7fa;
      --muted: #737b87;

      --blue: #3b82f6;
      --green: #22c55e;

      --border: #20242b;

      --card: #0c0f12;
      --card2: #050505;
      --card3: #000000;

      --activity: #11151a;

      --navbg: rgba(5, 6, 8, 0.94);
      --iconbg: #15191e;
      --line: #1c2127;
      --cardborder: #242931;
    }

    /* ==============================
   LIGHT THEME
============================== */

    body.light {
      --bg: #f3f5f8;

      --white: #111827;
      --muted: #6b7280;

      --blue: #2563eb;
      --green: #16a34a;

      --border: #d7dde7;

      --card: #ffffff;
      --card2: #ffffff;
      --card3: #f8fafc;

      --activity: #eef2f7;
      --navbg: rgba(255, 255, 255, 0.95);
      --iconbg: #e8edf4;
      --line: #d6dde6;
      --cardborder: #d8e0ea;
    }

    html {
      background: var(--bg);
    }

    body {
      background:
        radial-gradient(circle at 50% 18%,
          rgba(59, 130, 246, 0.1),
          transparent 35%),
        var(--bg);

      color: var(--white);

      transition:
        background 0.35s,
        color 0.35s;

      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
        sans-serif;

      min-height: 100vh;

      overflow-x: hidden;
    }

    /* =========================================
           MAIN APP
        ========================================= */

    .app {
      width: 100%;
      max-width: 500px;

      margin: auto;

      padding: 25px 18px 110px;
    }

    /* ==========================
    HEADER
    ========================== */

    .header {

      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 20px;

    }

    .header h1 {

      font-size: 28px;
      font-weight: 700;

    }

    #search {

      margin-left: auto;

      width: 180px;

      height: 40px;

      border: none;

      outline: none;

      border-radius: 12px;

      padding: 0 14px;

      background: var(--card);

      color: var(--white);

      border: 1px solid var(--cardborder);

      font-size: 14px;

    }

    #search::placeholder {

      color: var(--muted);

    }

    /* ==========================
    MEMBER LIST
    ========================== */

    .member {

      display: flex;

      align-items: center;

      justify-content: space-between;

      text-decoration: none;

      color: inherit;

      padding: 14px 0;

      border-bottom: 1px solid var(--line);

      transition: .15s;

    }

    .member:last-child {

      border-bottom: none;

    }

    .member:hover {

      background: rgba(255, 255, 255, .02);

    }

    .member:active {

      background: rgba(59, 130, 246, .08);

    }

    .member-info {

      flex: 1;

      min-width: 0;

    }

    .name {

      font-size: 16px;

      font-weight: 600;

      color: var(--white);

    }

    .address {

      margin-top: 3px;

      color: var(--muted);

      font-size: 13px;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

    }

    .phone {

      margin-left: 18px;

      font-size: 14px;

      font-weight: 600;

      color: var(--blue);

      white-space: nowrap;

    }






    /* =========================================
           BOTTOM NAVIGATION
        ========================================= */

    .bottom-nav {
      position: fixed;

      z-index: 100;

      left: 0;
      right: 0;
      bottom: 0;

      max-width: 500px;

      height: 70px;

      margin: auto;

      background: var(--navbg);
      border-top: 1px solid var(--cardborder);

      backdrop-filter: blur(18px);

      display: flex;

      justify-content: space-around;
    }

    .nav-item {
      width: 33.33%;

      border: none;

      background: transparent;
      color: var(--muted);

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      gap: 4px;

      position: relative;

      cursor: pointer;
      text-decoration: none;
    }

    .nav-icon {
      font-size: 21px;
    }

    .nav-item span {
      font-size: 10px;
    }

    .nav-item.active {
      color: var(--white);
    }

    .nav-item.active .nav-icon {
      color: var(--blue);

      text-shadow: 0 0 14px rgba(59, 130, 246, 0.8);
    }

    .nav-item.active::after {
      content: "";

      position: absolute;

      bottom: 0;

      width: 25px;

      height: 2px;

      background: var(--blue);

      box-shadow: 0 0 10px var(--blue);
    }

    /* =========================================
           SMALL PHONES
        ========================================= */

    @media (max-width: 350px) {
      .app {
        padding-left: 13px;
        padding-right: 13px;
      }

      .stat-card {
        height: 200px;

        padding: 23px;
      }

      .stat-number {
        font-size: 50px;
      }

      .showcase {
        height: 325px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- =====================================
         HEADER
    ====================================== -->
    <div class="header">

      <h1>Members</h1>
      <input id="search" type="text" placeholder="🔍 Search member...">
    </div>

    {% for member in members %}
    <a href="/members/{{member.id}}" class="member">
      <div class="member-info">
        <div class="name">{{member.name}}</div>
        <div class="address">
          {{member.address[:25]}}...
        </div>
      </div>
      <div class="phone">
        +91 {{member.phone}}
      </div>

    </a>
    {% endfor %}




    <!-- =========================================
     BOTTOM NAVIGATION
========================================= -->

    <nav class="bottom-nav">
      <!-- HOME -->

      <a href="/" class="nav-item " onclick="selectNav(this, 'Home')">
        <div class="nav-icon">⌂</div>

        <span> Home </span>
      </a>

      <!-- MEMBERS -->

      <a href="/members" class="nav-item active" onclick="selectNav(this, 'Members')">
        <div class="nav-icon">♙</div>

        <span> Members </span>
      </a>

      <!-- SETTINGS -->

      <a href="/settings" class="nav-item" onclick="selectNav(this, 'Settings')">
        <div class="nav-icon">⚙</div>

        <span> Settings </span>
      </a>
    </nav>

    <script>
      if (localStorage.getItem("theme") === "light") {
        document.body.classList.add("light")
      }

      const search = document.getElementById("search");
      search.addEventListener("input", () => {
    
        const q = search.value.trim().toLowerCase();
    
        document.querySelectorAll(".member").forEach(card => {
    
            const name = card.querySelector(".name").textContent.toLowerCase();
            const phone = card.querySelector(".phone").textContent;
            const address = card.querySelector(".address").textContent.toLowerCase();
    
            const match =
                name.includes(q) ||
                phone.includes(q) ||
                address.includes(q);
    
            card.style.display = match ? "flex" : "none";
        });
    
    });
    </script>
</body>

</html>
