<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Members</title>

    <style>
      /* =========================================
   RESET
========================================= */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        /* DARK */

        --bg: #050608;

        --white: #f5f7fa;
        --muted: #737b87;

        --blue: #3b82f6;
        --green: #22c55e;

        --border: #20242b;

        --card: #0c0f12;
        --card2: #050505;
        --card3: #000000;

        --activity: #11151a;

        --navbg: rgba(5, 6, 8, 0.94);
        --iconbg: #15191e;
        --line: #1c2127;
        --cardborder: #242931;
      }

      /* =========================================
   LIGHT THEME
========================================= */

      body.light {
        background:
          radial-gradient(
            circle at 15% 10%,
            rgba(96, 165, 250, 0.28),
            transparent 30%
          ),
          radial-gradient(
            circle at 85% 20%,
            rgba(74, 222, 128, 0.22),
            transparent 30%
          ),
          linear-gradient(180deg, #f9fbff, #edf5ff);
      }

      body.light {
        --bg:
          radial-gradient(
            circle at 0% 0%,
            rgba(96, 165, 250, 0.28),
            transparent 35%
          ),
          radial-gradient(
            circle at 100% 15%,
            rgba(74, 222, 128, 0.22),
            transparent 30%
          ),
          radial-gradient(
            circle at 50% 100%,
            rgba(129, 140, 248, 0.16),
            transparent 35%
          ),
          linear-gradient(180deg, #f8fbff, #eef4fb);

        --white: #111827;
        --muted: #6b7280;

        --blue: #2563eb;
        --green: #16a34a;

        --border: #d7dde7;

        --card: #ffffff;
        --card2: #ffffff;
        --card3: #f8fafc;

        --activity: #eef2f7;

        --navbg: rgba(255, 255, 255, 0.95);

        --iconbg: #e8edf4;

        --line: #d6dde6;

        --cardborder: #d8e0ea;
      }

      /* =========================================
   BODY
========================================= */

      html {
        background: var(--bg);
      }

      body {
        min-height: 100vh;
        overflow-x: hidden;
        color: var(--white);

        background:
          radial-gradient(
            circle at 15% 10%,
            rgba(59, 130, 246, 0.22),
            transparent 25%
          ),
          radial-gradient(
            circle at 85% 20%,
            rgba(34, 197, 94, 0.18),
            transparent 25%
          ),
          radial-gradient(
            circle at 50% 75%,
            rgba(139, 92, 246, 0.12),
            transparent 35%
          ),
          radial-gradient(
            circle at 80% 90%,
            rgba(59, 130, 246, 0.1),
            transparent 30%
          ),
          linear-gradient(180deg, #0c1320, #050608);

        background-attachment: fixed;
      }

      /* =========================================
   MAIN
========================================= */

      .app {
        width: 100%;
        max-width: 500px;
        margin: 0 auto;
        padding: 25px 16px 100px;
      }

      /* =========================================
   HEADER
========================================= */

      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 24px;
      }

      .header-left {
        display: flex;
        flex-direction: column;
      }

      .subtitle {
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
      }

      #themeBtn {
        width: 42px;
        height: 42px;
        border: none;
        border-radius: 50%;
        background: var(--card);
        color: var(--white);
        cursor: pointer;
        flex-shrink: 0;
      }

      /* =========================================
   MEMBER CARD
========================================= */

      .member {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;

        text-decoration: none;
        color: inherit;

        padding: 18px;
        margin-bottom: 16px;

        border-radius: 22px;

        background: var(--card);

        border: 1px solid var(--cardborder);

        backdrop-filter: blur(14px);

        transition: 0.2s;

        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
      }

      .member {
      }

      .member:hover {
        transform: translateY(-3px);

        border-color: rgba(59, 130, 246, 0.45);

        box-shadow: 0 15px 35px rgba(59, 130, 246, 0.12);
      }

      .member:active {
        transform: scale(0.98);
      }

      .left {
        flex: 1;
      }

      .name {
        font-size: 17px;

        font-weight: 600;

        color: var(--white);
      }

      .address {
        margin-top: 6px;

        color: var(--muted);

        font-size: 13px;
      }

      .phone {
        color: var(--blue);

        font-weight: 600;

        font-size: 14px;

        margin-left: 15px;

        white-space: nowrap;
      }

      /* =========================================
   BOTTOM NAVIGATION
========================================= */

      .bottom-nav {
        position: fixed;

        left: 50%;
        transform: translateX(-50%);

        width: 100%;
        max-width: 500px;

        height: 70px;

        z-index: 100;

        display: flex;
        justify-content: space-around;

        background: var(--navbg);

        border-top: 1px solid var(--cardborder);

        backdrop-filter: blur(18px);
        bottom: 0;
      }

      .bottom-nav a {
        text-decoration: none;
      }

      .nav-item {
        width: 33.33%;

        background: transparent;

        color: var(--muted);

        display: flex;

        flex-direction: column;

        justify-content: center;

        align-items: center;

        gap: 4px;

        position: relative;

        cursor: pointer;
      }

      .nav-icon {
        font-size: 21px;
      }

      .nav-item span {
        font-size: 10px;
      }

      .nav-item.active {
        color: var(--white);
      }

      .nav-item.active .nav-icon {
        color: var(--blue);

        text-shadow: 0 0 14px rgba(59, 130, 246, 0.8);
      }

      .nav-item.active::after {
        content: "";

        position: absolute;

        bottom: 0;

        width: 25px;

        height: 2px;

        background: var(--blue);

        box-shadow: 0 0 10px var(--blue);
      }

      /* =========================================
   SMALL PHONES
========================================= */

      @media (max-width: 350px) {
        .app {
          padding-left: 13px;
          padding-right: 13px;
        }

        .name {
          font-size: 15px;
        }

        .phone {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <div class="header-left">
          <h1>Members</h1>
          <p class="subtitle">247 registered members</p>
        </div>

        <button id="themeBtn">🌙</button>
      </div>

      <a href="/members/Rahul%20Sharma" class="member">
        <div class="left">
          <div class="name">Rahul Sharma</div>

          <div class="address">Sector 12...</div>
        </div>

        <div class="phone">9876543210</div>
      </a>

      <a href="/members/Ankit%20Verma" class="member">
        <div class="left">
          <div class="name">Ankit Verma</div>

          <div class="address">Model Town...</div>
        </div>

        <div class="phone">9123456789</div>
      </a>

      <a href="/members/Rohit%20Kumar" class="member">
        <div class="left">
          <div class="name">Rohit Kumar</div>

          <div class="address">Green Park...</div>
        </div>

        <div class="phone">9988776655</div>
      </a>
    </div>

    <!-- Bottom Navbar -->

    <nav class="bottom-nav">
      <!-- HOME -->

      <a href="/" class="nav-item" onclick="selectNav(this, 'Home')">
        <div class="nav-icon">⌂</div>

        <span> Home </span>
      </a>

      <!-- MEMBERS -->

      <a
        href="/members"
        class="nav-item active"
        onclick="selectNav(this, 'Members')"
      >
        <div class="nav-icon">♙</div>

        <span> Members </span>
      </a>

      <!-- SETTINGS -->

      <a href="/setting" class="nav-item" onclick="selectNav(this, 'Settings')">
        <div class="nav-icon">⚙</div>

        <span> Settings </span>
      </a>
    </nav>

    <script>
      const btn = document.getElementById("themeBtn");

      function loadTheme() {
        if (localStorage.getItem("theme") === "light") {
          document.body.classList.add("light");
          btn.innerHTML = "☀️";
        }
      }

      btn.onclick = function () {
        document.body.classList.toggle("light");

        if (document.body.classList.contains("light")) {
          localStorage.setItem("theme", "light");
          btn.innerHTML = "☀️";
        } else {
          localStorage.setItem("theme", "dark");
          btn.innerHTML = "🌙";
        }
      };

      loadTheme();
    </script>
  </body>
</html>
